<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Selecteur</title>

	<style>
		body{font-family: sans-serif;}
		div{color: orangered;}
		.quote{font-size: 4rem;}
		.source{font-style: italic; color: red;}
		.important{background: blue;}

		.citation{margin: 4rem;
				padding: 2rem;
				border: 1px solid darkcyan;
				border-radius: 1rem;
				aspect-ratio: 1.4/1;}

		#bob{background: pink;}

	</style>

</head>

<body>
	
	<div class="citation">
		<div class="quote important">"Lalallalalala"</div>
		<div class="source">- anonyme</div>
	</div>

	<div class="citation" id="bob">
		<div class="quote">blebleble</div>
		<div class="source">:p</div>
	</div>

</body>
</html>
